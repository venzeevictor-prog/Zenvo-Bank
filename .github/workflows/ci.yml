name: ZenvoBank CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenvobank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zenvobank_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zenvobank_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: find src public tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend test suite
        run: npm test
      - name: Smoke test served web application
        shell: bash
        run: |
          npm start > /tmp/zenvobank-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/zenvobank-home.html; then break; fi
            sleep 1
          done
          grep -q 'ZenvoBank' /tmp/zenvobank-home.html
          curl --fail --silent http://127.0.0.1:3000/styles.css | grep -q ':root'
          curl --fail --silent http://127.0.0.1:3000/app.js | grep -q 'function overview'
